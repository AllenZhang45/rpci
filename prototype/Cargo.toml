[package]
name = "ime-probe"
version = "0.1.9"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native COSMIC/Wayland Wubi and Pinyin input method"
repository = "https://github.com/AllenZhang45/rpci"
homepage = "https://github.com/AllenZhang45/rpci"
readme = "README.md"
authors = ["RPCI IME contributors"]
keywords = ["input-method", "wubi", "pinyin", "wayland", "cosmic"]
categories = ["gui", "internationalization"]

[dependencies]
cosmic-protocols = "0.2.0"
cosmic-text = "0.19.0"
libc = "0.2.191"
librime-sys = "0.4.0"
memmap2 = "0.9.11"
png = "0.18.1"
rime-api = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = "0.21.1"
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"
