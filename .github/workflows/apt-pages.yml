name: APT Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true
        default: "v0.1.9"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  gate:
    name: Check signing secret
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check APT_GPG_PRIVATE_KEY
        id: check
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "APT_GPG_PRIVATE_KEY is not configured; skipping Pages deployment."
          fi

  publish:
    name: Publish signed APT repository
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-utils \
            dpkg-dev \
            gnupg \
            gzip

      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --pattern "rpci-ime_${VERSION}_amd64.deb" \
            --dir dist

      - name: Build signed repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "missing repository secret APT_GPG_PRIVATE_KEY" >&2
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/apt-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

          KEY_ID="${APT_GPG_KEY_ID:-}"
          if [ -z "$KEY_ID" ]; then
            KEY_ID="$(gpg --list-secret-keys --with-colons \
              | awk -F: '/^sec:/{print $5; exit}')"
          fi
          if [ -z "$KEY_ID" ]; then
            echo "no signing key imported" >&2
            exit 1
          fi

          RPCI_DEBS="$PWD/dist/rpci-ime_${VERSION}_amd64.deb" \
          RPCI_SKIP_BUILD=1 \
          RPCI_REPO_DIR="$PWD/site" \
          RPCI_GPG_HOME="$GNUPGHOME" \
          RPCI_GPG_KEY="$KEY_ID" \
            ./prototype/packaging/build-repo.sh

          cp prototype/packaging/apt-index.html site/index.html
          touch site/.nojekyll
          gpgv --keyring site/rpci-ime-archive-keyring.gpg \
            site/dists/stable/InRelease

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
