name: CI

on:
  # Release tags run CI from release.yml. Manual runs remain available for debugging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test, package and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libclang-dev \
            librime-dev \
            librime-data \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            desktop-file-utils \
            gnupg \
            dpkg-dev \
            apt-utils \
            python3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run CI
        env:
          CARGO_TERM_COLOR: always
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          BINDGEN_EXTRA_CLANG_ARGS: -I/usr/lib/llvm-18/lib/clang/18/include
        run: ./prototype/scripts/ci.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: rpci-ime-deb
          path: dist/rpci-ime_*.deb
          if-no-files-found: error
